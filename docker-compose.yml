version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: builduser
      POSTGRES_PASSWORD: buildpass
      POSTGRES_DB: buildhistory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  pgdata:
  grafana-data: